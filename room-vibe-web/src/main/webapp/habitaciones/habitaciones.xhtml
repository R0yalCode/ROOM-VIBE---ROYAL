<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:p="primefaces"
                template="/WEB-INF/templates/base.xhtml">

    <ui:define name="title-view">Habitaciones</ui:define>

    <ui:define name="head">
        <h:outputStylesheet library="css" name="habitaciones.css" />
    </ui:define>

<ui:define name="content">
    <f:view>
        <div class="container">
            <h1 class="titulo-principal">Habitaciones</h1>
            <p:carousel value="#{carouselHabitacionesView.habitaciones}" var="hab"
                        numVisible="3" numScroll="1" circular="true" autoplayInterval="3000"
                        responsiveOptions="#{carouselHabitacionesView.responsiveOptions}">
                <div class="servicio-card">
                    <p:graphicImage value="#{resource[hab.imagen]}" alt="#{hab.nombre}" />
                </div>
            </p:carousel>
        </div>
    </f:view>
</ui:define>
</ui:composition>
